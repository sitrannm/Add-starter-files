<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive order summary component.">
  <title>Order Summary Component | Frontend Mentor</title>

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="page">

    <article class="summary">

      <img
        class="summary__hero"
        src="./images/illustration-hero.svg"
        alt=""
        width="450"
        height="235"
      >

      <div class="summary__body">

        <h1 class="summary__title">Order Summary</h1>

        <p class="summary__text">
          You can now listen to millions of songs, audiobooks, and podcasts
          on any device anywhere you like!
        </p>

        <div class="plan">
          <img class="plan__icon" src="./images/icon-music.svg" alt="" width="56" height="56">

          <div class="plan__info">
            <p class="plan__name">Annual Plan</p>
            <p class="plan__price">$59.99/year</p>
          </div>

          <a class="plan__change" href="#">Change</a>
        </div>

        <button class="btn" type="button">Proceed to Payment</button>

        <button class="cancel" type="button">Cancel Order</button>

      </div>

    </article>

  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener">Frontend Mentor</a>.
    Coded by <a href="https://github.com/sitrannm">Sitra Seyfu Shifa</a>.
  </footer>

</body>
</html>
